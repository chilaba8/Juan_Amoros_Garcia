<style>
  :root{
    --ground:#0D121C;
    --surface:#141B29;
    --surface-2:#1B2333;
    --border:rgba(231,234,242,0.09);
    --border-strong:rgba(231,234,242,0.16);
    --ink:#E7EAF2;
    --muted:#8B93A8;
    --muted-2:#5F677C;
    --accent:#E3A438;
    --accent-ink:#1D1404;
    --ok:#4ADE80;
    --ok-bg:rgba(74,222,128,0.10);
    --ok-border:rgba(74,222,128,0.28);
    --pending:#7BB4D6;
    --pending-bg:rgba(123,180,214,0.10);
    --pending-border:rgba(123,180,214,0.28);
    --font-display:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--font-display);
    font-weight:400;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  h1,h2,h3{text-wrap:balance; margin:0;}
  ::selection{background:var(--accent); color:var(--accent-ink);}

  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  a:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:4px;}

  /* ambient grid backdrop — restrained, single use */
  .backdrop{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 40% at 15% -10%, rgba(227,164,56,0.06), transparent 60%),
      radial-gradient(ellipse 50% 35% at 100% 10%, rgba(123,180,214,0.05), transparent 60%),
      var(--ground);
  }

  .wrap{max-width:1120px; margin:0 auto; padding:0 24px;}

  /* NAV */
  nav.topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(13,18,28,0.86);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{display:flex; align-items:center; justify-content:space-between; height:56px;}
  .brand{font-weight:600; font-size:15px; letter-spacing:0.02em;}
  .brand .dot{color:var(--accent);}
  .navlinks{display:flex; gap:22px;}
  .navlinks a{
    font-size:13px; color:var(--muted); text-decoration:none;
    letter-spacing:0.02em; transition:color .15s ease;
  }
  .navlinks a:hover{color:var(--ink);}
  .langswitch{display:flex; gap:2px; background:var(--surface); padding:3px; border-radius:8px; border:1px solid var(--border);}
  .langswitch button{
    font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:0.04em;
    padding:5px 10px; border-radius:6px; border:none; cursor:pointer;
    background:transparent; color:var(--muted-2); text-transform:uppercase;
    transition:background .15s ease, color .15s ease;
  }
  .langswitch button.active{background:var(--accent); color:var(--accent-ink);}
  .langswitch button:not(.active):hover{color:var(--ink); background:var(--surface-2);}
  @media (max-width:640px){ .navlinks{display:none;} }

  /* HERO */
  .hero{padding:56px 0 40px; display:flex; gap:36px; align-items:flex-start; flex-wrap:wrap;}
  .avatar{
    width:96px; height:96px; border-radius:16px; flex-shrink:0;
    background:linear-gradient(155deg, var(--surface-2), var(--surface));
    border:1px solid var(--border-strong);
    overflow:hidden;
  }
  .avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .hero-main{flex:1; min-width:280px;}
  .status-line{
    display:flex; align-items:center; gap:8px; margin-bottom:14px;
    font-family:var(--font-mono); font-size:12.5px; color:var(--ok); letter-spacing:0.01em;
  }
  .status-dot{
    width:7px; height:7px; border-radius:50%; background:var(--ok); flex-shrink:0;
    box-shadow:0 0 0 3px var(--ok-bg);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.45;} }
  @media (prefers-reduced-motion: reduce){ .status-dot{animation:none;} }

  h1.name{font-size:clamp(1.9rem,4vw,2.75rem); font-weight:700; letter-spacing:-0.01em;}
  h1.name .last{color:var(--muted);}
  .role{font-size:17px; color:var(--muted); font-weight:400; margin-top:6px;}

  .contact-row{display:flex; flex-wrap:wrap; gap:16px; margin:18px 0 22px; font-size:13.5px;}
  .contact-row a, .contact-row span{
    display:flex; align-items:center; gap:6px; color:var(--muted);
    text-decoration:none; transition:color .15s ease;
  }
  .contact-row a:hover{color:var(--accent);}
  .contact-row svg{width:15px; height:15px; flex-shrink:0;}

  .bio{
    background:var(--surface); border:1px solid var(--border); border-left:2px solid var(--accent);
    border-radius:0 10px 10px 0; padding:18px 20px; font-size:15px; line-height:1.65; color:var(--ink);
    max-width:62ch;
  }

  /* CREDIBILITY STRIP */
  .cred-strip{display:flex; flex-wrap:wrap; gap:10px; margin:26px 0 8px;}
  .chip{
    display:flex; align-items:center; gap:8px;
    padding:8px 14px; border-radius:999px; font-size:13px;
    background:var(--ok-bg); border:1px solid var(--ok-border); color:var(--ink);
  }
  .chip.pending{background:var(--pending-bg); border-color:var(--pending-border);}
  .chip .cdot{width:6px; height:6px; border-radius:50%; background:var(--ok); flex-shrink:0;}
  .chip.pending .cdot{background:var(--pending);}
  .chip b{font-weight:600;}
  .chip span.chip-muted{color:var(--muted); font-size:12px;}

  /* SECTIONS */
  main{padding:12px 0 60px;}
  .grid{display:grid; grid-template-columns:1.65fr 1fr; gap:52px; margin-top:44px;}
  @media (max-width:880px){ .grid{grid-template-columns:1fr; gap:44px;} }

  section.block{margin-bottom:44px;}
  section.block:last-child{margin-bottom:0;}
  .block-head{display:flex; align-items:baseline; gap:10px; margin-bottom:20px;}
  .block-head .idx{font-family:var(--font-mono); font-size:12px; color:var(--muted-2);}
  .block-head h2{font-size:19px; font-weight:600; letter-spacing:-0.005em;}
  .block-head .rule{flex:1; height:1px; background:var(--border);}

  /* EXPERIENCE TIMELINE */
  .timeline{position:relative; padding-left:26px; border-left:1px solid var(--border);}
  .tl-item{position:relative; padding-bottom:28px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-node{
    position:absolute; left:-30px; top:5px; width:9px; height:9px; border-radius:50%;
    background:var(--ground); border:2px solid var(--muted-2);
  }
  .tl-item:hover .tl-node{border-color:var(--accent);}
  .tl-header{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:5px;}
  .tl-role{font-size:16px; font-weight:600;}
  .tl-date{font-family:var(--font-mono); font-size:12px; color:var(--muted-2); white-space:nowrap;}
  .tl-company{font-size:13.5px; color:var(--accent); font-weight:500; margin-bottom:8px;}
  .tl-desc{font-size:14px; color:var(--muted); line-height:1.6; max-width:60ch;}

  /* CARDS (education / projects) */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:16px 18px; margin-bottom:12px;
  }
  .card:last-child{margin-bottom:0;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:4px;}
  .card-title{font-size:14.5px; font-weight:600; line-height:1.35;}
  .card-org{font-size:13px; color:var(--muted); margin-top:3px;}
  .card-meta{font-family:var(--font-mono); font-size:11px; color:var(--muted-2); margin-top:8px; display:flex; gap:10px; flex-wrap:wrap;}
  .card-desc{font-size:12.5px; color:var(--muted); line-height:1.55; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}
  .status-tag{
    font-family:var(--font-mono); font-size:10.5px; font-weight:600; letter-spacing:0.03em;
    padding:3px 8px; border-radius:5px; white-space:nowrap; text-transform:uppercase;
  }
  .status-tag.done{background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok-border);}
  .status-tag.wip{background:var(--pending-bg); color:var(--pending); border:1px solid var(--pending-border);}
  .badge-slot{width:38px; height:48px; flex-shrink:0;}

  /* SKILLS */
  .tag-group{margin-bottom:16px;}
  .tag-group:last-child{margin-bottom:0;}
  .tag-label{font-size:11px; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted-2); margin-bottom:9px; font-weight:600;}
  .tags{display:flex; flex-wrap:wrap; gap:7px;}
  .tag{
    font-size:12.5px; padding:6px 11px; border-radius:6px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--ink);
  }
  .tag.hard{border-color:var(--border-strong); color:var(--ink);}

  .lang-list{display:flex; flex-direction:column; gap:9px;}
  .lang-row{display:flex; justify-content:space-between; align-items:center; font-size:13.5px;}
  .lang-level{
    font-family:var(--font-mono); font-size:11px; padding:3px 9px; border-radius:5px;
    background:var(--surface-2); color:var(--muted); border:1px solid var(--border);
  }

  /* PROJECTS */
  .proj-card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:16px 18px; margin-bottom:12px; text-decoration:none; display:block;
    transition:border-color .15s ease, transform .15s ease;
  }
  .proj-card:last-child{margin-bottom:0;}
  .proj-card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .proj-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .proj-name{font-family:var(--font-mono); font-size:13.5px; font-weight:600; color:var(--ink);}
  .proj-desc{font-size:12.5px; color:var(--muted); margin-top:7px; line-height:1.55;}
  .proj-top svg{width:14px; height:14px; color:var(--muted-2); flex-shrink:0;}
  .proj-card:hover .proj-top svg{color:var(--accent);}

  /* CONTACT FOOTER */
  .contact-footer{
    margin-top:60px; padding-top:32px; border-top:1px solid var(--border);
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:20px;

  .contact-cta{display:flex; gap:12px; flex-wrap:wrap;}
  .cta-btn{
    display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:8px;
    font-size:13.5px; font-weight:500; text-decoration:none; border:1px solid var(--border-strong);
    color:var(--ink); transition:border-color .15s ease, background .15s ease;
  }
  .cta-btn:hover{border-color:var(--accent); background:var(--surface);}
  .cta-btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .cta-btn.primary:hover{opacity:0.92; background:var(--accent);}
  .cta-btn svg{width:15px; height:15px;}
  .footer-note{font-family:var(--font-mono); font-size:11px; color:var(--muted-2);}
</style>

          <div className="hero-main">
            <div className="status-line">
              <span className="status-dot"></span>
              <span>{t.status}</span>
            </div>
            <h1 className="name">Juan <span className="last">Amorós García</span></h1>
            <p className="role">{t.role}</p>

            <div className="contact-row">
              <a href="mailto:amorosgarciaj@gmail.com"><Icon.Mail />amorosgarciaj@gmail.com</a>
              <a href="tel:+34661221313"><Icon.Phone />+34 661 22 13 13</a>
              <span><Icon.Pin />{t.location}</span>
            </div>

            <div className="bio">{t.bio}</div>

            <div className="cred-strip">
              {t.cred.map((c, i) => (
                <div key={i} className={"chip" + (c.state === 'pending' ? ' pending' : '')}>
                  <span className="cdot"></span>
                  <b>{c.label}</b>
                  <span className="chip-muted">{c.meta}</span>
                </div>
              ))}
            </div>
          </div>
        </section>

        <div className="grid">
          <div>
            <section className="block" id="experience">
              <div className="block-head">
                <span className="idx mono">01</span>
                <h2>{t.experience.title}</h2>
                <span className="rule"></span>
              </div>
              <div className="timeline">
                {t.experience.items.map((job, i) => (
                  <div className="tl-item" key={i}>
                    <span className="tl-node"></span>
                    <div className="tl-header">
                      <span className="tl-role">{job.role}</span>
                      <span className="tl-date mono">{job.date}</span>
                    </div>
                    <div className="tl-company">{job.company}</div>
                    <p className="tl-desc">{job.desc}</p>
                  </div>
                ))}
              </div>
            </section>
          </div>

          <div>
            <section className="block" id="education">
              <div className="block-head">
                <span className="idx mono">02</span>
                <h2>{t.education.title}</h2>
                <span className="rule"></span>
              </div>
              {t.education.items.map((ed, i) => (
                <div className="card" key={i}>
                  <div className="card-top">
                    <div>
                      <div className="card-title">{ed.degree}</div>
                      <div className="card-org">{ed.school}</div>
                    </div>
                    {ed.badge && <div className="badge-slot"><EjptBadge /></div>}
                  </div>
                  <div className="card-meta">
                    <span className={"status-tag " + ed.status}>{ed.status === 'done' ? (lang === 'es' ? 'Completado' : lang === 'en' ? 'Completed' : 'Abgeschlossen') : (lang === 'es' ? 'En curso' : lang === 'en' ? 'In progress' : 'Laufend')}</span>
                    <span>{ed.date}</span>
                  </div>
                  {ed.desc && <div className="card-desc">{ed.desc}</div>}
                </div>
              ))}
            </section>

            <section className="block" id="skills">
              <div className="block-head">
                <span className="idx mono">03</span>
                <h2>{t.skills.title}</h2>
                <span className="rule"></span>
              </div>
              <div className="card">
                <div className="tag-group">
                  <div className="tag-label">{t.skills.hardLabel}</div>
                  <div className="tags">{t.skills.hard.map((s, i) => <span className="tag hard" key={i}>{s}</span>)}</div>
                </div>
                <div className="tag-group">
                  <div className="tag-label">{t.skills.softLabel}</div>
                  <div className="tags">{t.skills.soft.map((s, i) => <span className="tag" key={i}>{s}</span>)}</div>
                </div>
                <div className="tag-group">
                  <div className="tag-label">{t.skills.langLabel}</div>
                  <div className="lang-list">
                    {t.skills.langs.map((l, i) => (
                      <div className="lang-row" key={i}>
                        <span>{l.name}</span>
                        <span className="lang-level mono">{l.level}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </section>

            <section className="block" id="projects">
              <div className="block-head">
                <span className="idx mono">04</span>
                <h2>{t.projects.title}</h2>
                <span className="rule"></span>
              </div>
              {t.projects.items.map((p, i) => (
                <a className="proj-card" href={p.url} target="_blank" rel="noopener noreferrer" key={i}>
                  <div className="proj-top">
                    <span className="proj-name"><Icon.Github style={{width:'13px',height:'13px',marginRight:'6px',display:'inline-block',verticalAlign:'-2px'}} />{p.name}</span>
                    <Icon.Arrow />
                  </div>
                  <div className="proj-desc">{p.desc}</div>
                </a>
              ))}
            </section>
          </div>
        </div>

        <footer className="contact-footer">
          <div className="contact-cta">
            <a className="cta-btn primary" href="mailto:amorosgarciaj@gmail.com"><Icon.Mail />{t.contact.email}</a>
            <a className="cta-btn" href="tel:+34661221313"><Icon.Phone />+34 661 22 13 13</a>
          </div>
          <span className="footer-note">{t.contact.note}</span>
        </footer>
      </main>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
